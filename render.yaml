services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: smartvenue-ai-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python backend/run.py"
    plan: free
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.12.0

  # 2. React Vite Frontend Static Site
  - type: web
    name: smartvenue-ai-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    rootDir: "frontend"
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smartvenue-ai-backend
          property: host
